<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#F2F2F2" />
  <meta name="description" content="Practice graphic design layouts with simple shapes" />
  <title>Layout Practice</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app">

    <!-- Practice: design canvas -->
    <section id="view-practice" class="view">
      <header class="header compact">
        <span class="header-title" id="round-label">Round 1</span>
        <button id="btn-submit" type="button" class="btn btn-primary small">Submit</button>
      </header>
      <div class="canvas-wrap">
        <p class="canvas-hint" aria-hidden="true">Tap a shape to select · Drag corners to resize · Use ↻ to rotate</p>
        <div id="canvas-container">
          <canvas id="design-canvas" width="360" height="480"></canvas>
          <div id="selection-ui" class="hidden">
            <div id="selection-box"></div>
            <div id="resize-handles"></div>
            <div id="rotate-handle"></div>
          </div>
        </div>
      </div>
      <div id="last-feedback-wrap" class="last-feedback-wrap hidden">
        <button id="btn-toggle-feedback" class="feedback-toggle" type="button">
          <span>Last critique</span>
          <span class="feedback-toggle-arrow">▾</span>
        </button>
        <div id="last-feedback-body" class="last-feedback-body hidden"></div>
      </div>
    </section>

    <!-- Feedback view -->
    <section id="view-feedback" class="view hidden">
      <header class="header compact">
        <span class="header-title">Critique</span>
        <button id="btn-next" type="button" class="btn btn-primary small">Draw Again</button>
      </header>
      <div id="feedback-image-wrap" class="feedback-image-wrap"></div>
      <div id="feedback-critique" class="feedback-critique"></div>
    </section>

  </div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
